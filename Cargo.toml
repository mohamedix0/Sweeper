[workspace]
members = [
  "backend/sweeper-winfs",
  "backend/sweeper-knowledge",
  "backend/sweeper-core",
  "backend/sweeper-testkit",
  "bridge/sweeper-contract",
  "bridge/sweeper-desktop",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_methods = "deny"

[workspace.dependencies]
sweeper-testkit = { path = "backend/sweeper-testkit" }
sweeper-winfs = { path = "backend/sweeper-winfs" }
sweeper-knowledge = { path = "backend/sweeper-knowledge" }
sweeper-core = { path = "backend/sweeper-core" }
sweeper-contract = { path = "bridge/sweeper-contract" }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
walkdir = "2"
