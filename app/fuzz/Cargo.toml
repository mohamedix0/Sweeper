[package]
name = "sweeper-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sweeper-core = { path = "../backend/sweeper-core" }
sweeper-knowledge = { path = "../backend/sweeper-knowledge" }
sweeper-contract = { path = "../bridge/sweeper-contract" }

[workspace]
members = ["."]

[[bin]]
name = "path_policy"
path = "fuzz_targets/path_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "contract_serde"
path = "fuzz_targets/contract_serde.rs"
test = false
doc = false
bench = false

[[bin]]
name = "allowlist_parser"
path = "fuzz_targets/allowlist_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_reader"
path = "fuzz_targets/journal_reader.rs"
test = false
doc = false
bench = false
