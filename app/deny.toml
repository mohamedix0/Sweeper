[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is an unmaintained transitive dependency via tauri-specta/specta (no safe upgrade available in current upstream dependency graph)." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is an unmaintained transitive dependency of Linux-only GTK/glib macro crates pulled in by Tauri; unused on Windows with no safe upgrade available upstream." },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
