tier = "Tier2"
risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "Google\\Chrome\\User Data\\Profile *\\Code Cache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Google Chrome compiled/script code cache for additional profiles (Profile *)."

[[targets]]
id = "chrome-gpu-cache-profiles"
