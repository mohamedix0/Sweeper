risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "Microsoft\\Edge\\User Data\\Default\\GPUCache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Microsoft Edge GPU cache for the Default profile."

[[targets]]
id = "edge-cache-profiles"
name = "Microsoft Edge Cache (Profile *)"
tier = "Tier2"
risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "Microsoft\\Edge\\User Data\\Profile *\\Cache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Microsoft Edge HTTP cache for additional profiles (Profile *)."

[[targets]]
id = "edge-code-cache-profiles"
name = "Microsoft Edge Code Cache (Profile *)"
tier = "Tier2"
risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "Microsoft\\Edge\\User Data\\Profile *\\Code Cache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
