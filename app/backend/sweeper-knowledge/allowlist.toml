tier = "Tier2"
risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "Google\\Chrome\\User Data\\Profile *\\GPUCache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Google Chrome GPU cache for additional profiles (Profile *)."

