[[targets]]
id = "edge-gpu-cache-profiles"
name = "Microsoft Edge GPU Cache (Profile *)"
tier = "Tier2"
risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "Microsoft\\Edge\\User Data\\Profile *\\GPUCache"
scope = "contents"
min_age_hours = 24
