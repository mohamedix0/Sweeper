relative_subpath = "Google\\Chrome\\User Data\\Default\\GPUCache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Google Chrome GPU cache for the Default profile. Regenerated automatically."

[[targets]]
id = "chrome-cache-profiles"
