[[targets]]
id = "vscode-cache"
name = "VS Code Cache"
tier = "Tier2"
risk = "Safe"
known_folder = "RoamingAppData"
relative_subpath = "Code\\Cache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Visual Studio Code Cache folder. Safe to clear; VS Code regenerates cache data. User settings and workspaceStorage are not targeted."

[[targets]]
id = "vscode-cached-data"
name = "VS Code CachedData"
tier = "Tier2"
risk = "Safe"
known_folder = "RoamingAppData"
relative_subpath = "Code\\CachedData"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Visual Studio Code CachedData folder containing cached runtime/browser assets. Regenerated by VS Code as needed."

[[targets]]
id = "pip-cache"
name = "pip Cache"
tier = "Tier2"
risk = "Caution"
known_folder = "LocalAppData"
relative_subpath = "pip\\Cache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "pip HTTP/wheel cache. Removing it frees space but may slow future installs while packages are re-downloaded."

[[targets]]
id = "nuget-v3-cache"
name = "NuGet v3 Cache"
tier = "Tier2"
risk = "Caution"
known_folder = "LocalAppData"
relative_subpath = "NuGet\\v3-cache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "NuGet v3 HTTP cache for the current user. Clearing can increase restore times while packages/metadata are fetched again."

[[targets]]
id = "jetbrains-caches"
name = "JetBrains IDE Caches"
tier = "Tier2"
risk = "Caution"
known_folder = "LocalAppData"
relative_subpath = "JetBrains\\*\\caches"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Per-version JetBrains IDE cache folders (LocalAppData\\JetBrains\\*\\caches). Clearing caches may slow IDE startup/indexing; only explicit caches leaf folders are targeted."

[[targets]]
id = "windows-temp"
name = "Windows Temp"
tier = "Tier3"
risk = "Caution"
known_folder = "Windows"
relative_subpath = "Temp"
scope = "contents"
min_age_hours = 24
requires_elevation = true
description = "Windows system temporary files under C:\\Windows\\Temp. Cleaning can reclaim space but may affect in-progress installers or system operations. Requires administrator elevation."

[[targets]]
id = "windows-update-download-cache"
name = "Windows Update Download Cache"
tier = "Tier3"
risk = "Caution"
known_folder = "Windows"
relative_subpath = "SoftwareDistribution\\Download"
scope = "contents"
min_age_hours = 24
requires_elevation = true
description = "Downloaded Windows Update packages under C:\\Windows\\SoftwareDistribution\\Download. Clearing can free space but may force updates to re-download. Requires administrator elevation."

[[targets]]
id = "windows-prefetch"
name = "Windows Prefetch"
tier = "Tier3"
risk = "Caution"
known_folder = "Windows"
relative_subpath = "Prefetch"
scope = "contents"
min_age_hours = 24
requires_elevation = true
description = "Windows Prefetch data under C:\\Windows\\Prefetch used to speed application launches. Clearing is recoverable but may temporarily reduce launch performance. Requires administrator elevation."

[[targets]]
id = "programdata-package-cache"
name = "ProgramData Package Cache"
tier = "Tier3"
risk = "Caution"
known_folder = "ProgramData"
relative_subpath = "Package Cache"
scope = "contents"
min_age_hours = 24
requires_elevation = true
description = "Installer package cache under C:\\ProgramData\\Package Cache. Removing contents can affect repair, modify, or uninstall of installed applications. Requires administrator elevation."
