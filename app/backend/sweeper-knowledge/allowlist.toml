# Embedded Tier 1 & Tier 2 allowlist (Phase 1B). Build-time linted by build.rs.
# Tier 3 targets are deferred to Phase 5 (not present/enabled here).

[[targets]]
id = "user-temp"
name = "User Temp"
tier = "Tier1"
risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "Temp"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Temporary files in the per-user LocalAppData Temp folder. Windows and applications recreate needed temp files automatically; cleaning old contents is generally safe."

[[targets]]
id = "crash-dumps"
name = "Crash Dumps"
tier = "Tier1"
risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "CrashDumps"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Local user-mode application crash dump files. Removing old dumps frees space and does not affect application functionality."

[[targets]]
id = "wer-reports"
name = "Windows Error Reporting"
tier = "Tier1"
risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "Microsoft\\Windows\\WER"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Windows Error Reporting queues and report data for the current user. These are diagnostic artifacts and can be safely removed after the minimum age."

[[targets]]
id = "inet-cache"
name = "Internet Cache (INetCache)"
tier = "Tier1"
risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "Microsoft\\Windows\\INetCache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Legacy Windows/WinINet internet cache for the current user. Cached web content is regenerated automatically when needed."

[[targets]]
id = "npm-cache"
name = "npm Cache"
tier = "Tier2"
risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "npm-cache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "npm package download cache. Removing it frees disk space; packages are re-downloaded on demand."

[[targets]]
id = "gradle-caches"
name = "Gradle Caches"
tier = "Tier2"
risk = "Caution"
known_folder = "UserProfile"
relative_subpath = ".gradle\\caches"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Gradle dependency and build caches in the user profile. Deleting caches can slow the next builds while dependencies are re-downloaded/rebuilt."

[[targets]]
id = "cargo-registry-cache"
name = "Cargo Registry Cache"
tier = "Tier2"
risk = "Safe"
known_folder = "UserProfile"
relative_subpath = ".cargo\\registry\\cache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Downloaded Rust crate archive cache (.crate files). Cargo can re-download them when needed; source checkouts/index are not targeted."

