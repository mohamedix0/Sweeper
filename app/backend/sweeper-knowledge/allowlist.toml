id = "chrome-cache-default"
name = "Google Chrome Cache (Default)"
tier = "Tier2"
risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "Google\\Chrome\\User Data\\Default\\Cache"
scope = "contents"
min_age_hours = 24
requires_elevation = false
description = "Google Chrome HTTP cache for the Default profile. Browser cache is regenerated automatically; profile data is not targeted."

[[targets]]
id = "chrome-code-cache-default"
name = "Google Chrome Code Cache (Default)"
tier = "Tier2"
risk = "Safe"
known_folder = "LocalAppData"
relative_subpath = "Google\\Chrome\\User Data\\Default\\Code Cache"
