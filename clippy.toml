# Static Gate A: ban deletion primitives in production code (backend/ and bridge/).
# `std::fs::remove_*` is banned everywhere in these crates; sweeper-winfs deletion
# primitives are banned everywhere except a single audited #[allow] inside core::remover.
# Log-file retirement is narrowly allowed only in sweeper-core::journal via audited allow.
disallowed-methods = [
  { path = "std::fs::remove_file", reason = "Gate A: use handle-based removal in sweeper-core::remover only" },
  { path = "std::fs::remove_dir", reason = "Gate A: use handle-based removal in sweeper-core::remover only" },
  { path = "std::fs::remove_dir_all", reason = "Gate A: use handle-based removal in sweeper-core::remover only" },

  { path = "sweeper_winfs::set_file_disposition_delete", reason = "Gate A: sweeper-winfs deletion primitives may only be invoked from sweeper-core::remover" },
  { path = "sweeper_winfs::open_for_delete", reason = "Gate A: sweeper-winfs deletion-open primitive may only be invoked from sweeper-core::remover" },
  { path = "sweeper_winfs::clear_readonly_attribute", reason = "Gate A: sweeper-winfs deletion-support primitive may only be invoked from sweeper-core::remover" },
  { path = "sweeper_winfs::retire_sweeper_log_file", reason = "Gate A: Sweeper log retirement may only be invoked from sweeper-core::journal (audited rotation)" },
]
